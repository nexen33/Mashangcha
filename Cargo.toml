[workspace]
members = ["core", "app"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Tun&PaMa AG"]  # <--- 请在此填写开发者名称（例如：["张三 <zhangsan@example.com>"] 或 ["某某科技有限公司"]）
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.197", features = ["derive"] }
bincode = "=1.3.3"
unicode-normalization = "=0.1.23"
pinyin = { version = "=0.10.0", default-features = false, features = ["plain"] }
calamine = "=0.24.0"
csv = "=1.3.0"
encoding_rs = "=0.8.33"
rust_xlsxwriter = "=0.64.0"
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc", "getrandom"] }
sha2 = "=0.10.8"
getrandom = "=0.2.12"
slint = { version = "=1.6.0", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-software", "std", "raw-window-handle-06"] }
slint-build = "=1.6.0"
raw-window-handle = "=0.6.0"
windows-sys = { version = "=0.52.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Graphics_Gdi",
] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

